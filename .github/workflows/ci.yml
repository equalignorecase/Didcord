name: native-client
run-name: Diagnose Windows native access violation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: true
          cache-on-failure: true
      - name: Enable bounded native crash evidence
        shell: pwsh
        run: |
          $path = 'HKLM:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $path -Force | Out-Null
          New-ItemProperty -Path $path -Name DumpFolder -Value "$env:RUNNER_TEMP\didcord-crashes" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $path -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $path -Name DumpCount -Value 1 -PropertyType DWord -Force | Out-Null
      - name: Reproduce exact workspace command
        shell: pwsh
        env:
          RUST_BACKTRACE: full
        run: |
          cargo test --workspace --locked -- --nocapture 2>&1 | Tee-Object workspace-tests.log
          exit $LASTEXITCODE
      - name: Compare workspace desktop binary serially
        if: always()
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/debug/deps/didcord-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'No desktop test executable' }
          & $exe.FullName --nocapture --test-threads=1 2>&1 | Tee-Object workspace-desktop-serial-tests.log
          exit $LASTEXITCODE
      - name: Compare workspace desktop binary in parallel
        if: always()
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/debug/deps/didcord-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & $exe.FullName --nocapture 2>&1 | Tee-Object "workspace-desktop-parallel-tests-$attempt.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Collect crash module evidence
        if: always()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue | Format-List TimeCreated,Message | Out-File crash-events.txt
          $events = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue
          foreach ($event in $events) {
            $xml = [xml]$event.ToXml()
            $data = @{}
            foreach ($entry in $xml.Event.EventData.Data) { $data[$entry.GetAttribute('Name')] = $entry.InnerText }
            $data | Format-List | Out-File fault-fields.txt -Append
            $symbolizer = 'C:\Program Files\LLVM\bin\llvm-symbolizer.exe'
            if ($data['ModulePath'] -and (Test-Path $symbolizer) -and (Test-Path $data['ModulePath'])) {
              & $symbolizer --relative-address "--obj=$($data['ModulePath'])" "0x$($data['FaultingOffset'])" 2>&1 | Out-File symbolized-crash.txt -Append
            }
          }
          exit 0
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: windows-native-diagnosis
          retention-days: 3
          path: |
            *test*.log
            crash-events.txt
            fault-fields.txt
            symbolized-crash.txt
            target/debug/deps/didcord-*.pdb
            target/debug/deps/didcord-*.exe
            ${{ runner.temp }}/didcord-crashes/*.dmp
